<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title description">
  <title id="title">KIFF shared operational data flow</title>
  <desc id="description">KIFF receives events from existing systems into a durable event log, derives current state, validates proposed actions against contracts and authority, records each decision, invokes an application executor, and feeds resulting events back into the shared operational record.</desc>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#E7EDF2" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#193249" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#15966E"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3478C7"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7654C9"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #122B3B; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #607388; }
      .zone { font: 700 13px Arial, sans-serif; letter-spacing: 1.4px; fill: #8AA0B5; }
      .card-title { font: 700 18px Arial, sans-serif; fill: #153244; }
      .card-copy { font: 400 14px Arial, sans-serif; fill: #607388; }
      .small { font: 600 12px Arial, sans-serif; fill: #607388; }
      .edge { font: 700 12px Arial, sans-serif; }
      .legend { font: 600 13px Arial, sans-serif; fill: #607388; }
    </style>
  </defs>

  <rect width="1600" height="860" rx="28" fill="#FBFCFE"/>
  <rect x="22" y="22" width="1556" height="816" rx="22" fill="url(#grid)" stroke="#DCE5EE" stroke-width="2"/>

  <text x="72" y="85" class="title">One shared operational domain</text>
  <text x="72" y="113" class="subtitle">Events establish shared state. Every actor proposes named actions against the same contracts, authority, and history.</text>

  <rect x="62" y="162" width="304" height="566" rx="20" fill="#F7FAFC" stroke="#C9D7E4" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="90" y="199" class="zone">01 / SOURCES AND ACTORS</text>

  <rect x="96" y="250" width="236" height="114" rx="14" fill="#F4EBDF" stroke="#D5B67E" stroke-width="2" filter="url(#shadow)"/>
  <text x="118" y="294" class="card-title">Existing systems</text>
  <text x="118" y="321" class="card-copy">events from your business</text>
  <text x="118" y="343" class="card-copy">and systems of record</text>

  <rect x="96" y="468" width="236" height="154" rx="14" fill="#E7F3F8" stroke="#68A7C0" stroke-width="2" filter="url(#shadow)"/>
  <text x="118" y="510" class="card-title">Actors</text>
  <text x="118" y="538" class="card-copy">agents, people, and services</text>
  <text x="118" y="569" class="small">all propose named actions</text>

  <rect x="412" y="162" width="772" height="566" rx="20" fill="#F8FCFA" stroke="#5AA981" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="440" y="199" class="zone">02 / KIFF DOMAIN</text>
  <text x="440" y="225" class="small">The operational model shared by every actor</text>

  <rect x="440" y="270" width="190" height="130" rx="14" fill="#E7F4EC" stroke="#47A875" stroke-width="2" filter="url(#shadow)"/>
  <text x="462" y="313" class="card-title">Event log</text>
  <text x="462" y="341" class="card-copy">normalize and persist</text>
  <text x="462" y="365" class="card-copy">what actually happened</text>

  <rect x="702" y="270" width="190" height="130" rx="14" fill="#E7F4EC" stroke="#47A875" stroke-width="2" filter="url(#shadow)"/>
  <text x="724" y="313" class="card-title">Current state</text>
  <text x="724" y="341" class="card-copy">derive what is true now</text>
  <text x="724" y="365" class="card-copy">from the event log</text>

  <rect x="964" y="270" width="190" height="130" rx="14" fill="#DDF1E6" stroke="#16875F" stroke-width="3" filter="url(#shadow)"/>
  <text x="986" y="313" class="card-title">Decision record</text>
  <text x="986" y="341" class="card-copy">allow, reject, or require</text>
  <text x="986" y="365" class="card-copy">an approval</text>

  <rect x="440" y="492" width="190" height="132" rx="14" fill="#E8F1F8" stroke="#679BC2" stroke-width="2" filter="url(#shadow)"/>
  <text x="462" y="535" class="card-title">Action contracts</text>
  <text x="462" y="563" class="card-copy">named actions, inputs,</text>
  <text x="462" y="587" class="card-copy">and expected outcomes</text>

  <rect x="702" y="492" width="190" height="132" rx="14" fill="#E8F1F8" stroke="#679BC2" stroke-width="2" filter="url(#shadow)"/>
  <text x="724" y="535" class="card-title">Authority checks</text>
  <text x="724" y="563" class="card-copy">policy, permissions, risk,</text>
  <text x="724" y="587" class="card-copy">and approvals</text>

  <rect x="964" y="492" width="190" height="132" rx="14" fill="#F0EAFC" stroke="#8B69D2" stroke-width="2" filter="url(#shadow)"/>
  <text x="986" y="535" class="card-title">Operational history</text>
  <text x="986" y="563" class="card-copy">events, decisions, approvals,</text>
  <text x="986" y="587" class="card-copy">and execution results</text>
  <text x="986" y="611" class="small">replayable evidence</text>

  <rect x="1234" y="162" width="304" height="566" rx="20" fill="#F7FAFC" stroke="#C9D7E4" stroke-width="2" stroke-dasharray="9 8"/>
  <text x="1262" y="199" class="zone">03 / EXECUTION</text>

  <rect x="1268" y="287" width="236" height="132" rx="14" fill="#E8F1F8" stroke="#679BC2" stroke-width="2" filter="url(#shadow)"/>
  <text x="1290" y="330" class="card-title">Your executor</text>
  <text x="1290" y="358" class="card-copy">performs valid side effects</text>
  <text x="1290" y="382" class="card-copy">in your environment</text>

  <rect x="1268" y="534" width="236" height="120" rx="14" fill="#F4EBDF" stroke="#D5B67E" stroke-width="2" filter="url(#shadow)"/>
  <text x="1290" y="576" class="card-title">Systems of record</text>
  <text x="1290" y="604" class="card-copy">payments, inventory, identity,</text>
  <text x="1290" y="628" class="card-copy">or any existing service</text>

  <path d="M332 307 H440" fill="none" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="354" y="274" width="78" height="26" rx="6" fill="#FFFFFF"/>
  <text x="365" y="292" class="edge" fill="#15966E">events</text>

  <path d="M630 335 H702" fill="none" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M892 335 H964" fill="none" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <path d="M1154 335 H1268" fill="none" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="1161" y="320" width="89" height="26" rx="6" fill="#FFFFFF"/>
  <text x="1171" y="338" class="edge" fill="#15966E">allowed</text>

  <path d="M332 545 H440" fill="none" stroke="#3478C7" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
  <rect x="346" y="512" width="104" height="26" rx="6" fill="#FFFFFF"/>
  <text x="357" y="530" class="edge" fill="#3478C7">proposal</text>
  <path d="M630 558 H702" fill="none" stroke="#3478C7" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>
  <path d="M892 558 H930 Q950 558 950 538 V416 Q950 400 970 400 H1059 Q1059 400 1059 400" fill="none" stroke="#3478C7" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-blue)"/>

  <path d="M1386 419 V534" fill="none" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <rect x="1398" y="466" width="94" height="26" rx="6" fill="#FFFFFF"/>
  <text x="1409" y="484" class="edge" fill="#15966E">side effect</text>

  <path d="M1268 594 H1184 Q1164 594 1164 574 V674 Q1164 692 1146 692 H522 Q440 692 440 610 V400" fill="none" stroke="#15966E" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="824" y="674" width="122" height="26" rx="6" fill="#FFFFFF"/>
  <text x="835" y="692" class="edge" fill="#15966E">resulting events</text>

  <path d="M535 400 V472 Q535 492 555 492 H964" fill="none" stroke="#7654C9" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <path d="M1059 400 V492" fill="none" stroke="#7654C9" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <path d="M1268 594 H1154" fill="none" stroke="#7654C9" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>

  <line x1="72" y1="782" x2="1528" y2="782" stroke="#DCE5EE" stroke-width="2"/>
  <text x="92" y="815" class="legend">Legend</text>
  <line x1="178" y1="810" x2="224" y2="810" stroke="#15966E" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="238" y="815" class="legend">operational flow</text>
  <line x1="420" y1="810" x2="466" y2="810" stroke="#3478C7" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-blue)"/>
  <text x="480" y="815" class="legend">action proposal</text>
  <line x1="650" y1="810" x2="696" y2="810" stroke="#7654C9" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrow-purple)"/>
  <text x="710" y="815" class="legend">audit evidence</text>
</svg>
